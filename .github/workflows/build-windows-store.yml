name: Build LohnMail Windows Store

on:
  push:
    branches:
      - main
      - feature/microsoft-store-installer
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-store.yml"
      - "lohnmail-pywebview-test/**"
  pull_request:
    paths:
      - ".github/workflows/build-windows-store.yml"
      - "lohnmail-pywebview-test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lohnmail-windows-store-${{ github.ref }}
  cancel-in-progress: false

env:
  MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'LohnMail.Test' }}
  MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=LohnMail Development' }}
  MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'LohnMail' }}
  MSIX_APPLICATION_ID: ${{ vars.MSIX_APPLICATION_ID || 'LohnMail' }}
  LOHNMAIL_STORE_URI: ${{ vars.LOHNMAIL_STORE_URI || '' }}

jobs:
  build-store:
    name: Test, build and validate MSIX x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            lohnmail-pywebview-test/requirements*.txt

      - name: Verify tag and source version
        shell: powershell
        run: |
          $Source = Get-Content "lohnmail-pywebview-test\ui_web\version.py" -Raw
          $Match = [regex]::Match($Source, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $Match.Success) { throw "APP_VERSION wurde nicht gefunden." }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $TagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($TagVersion -ne $Match.Groups[1].Value) {
              throw "Tag $TagVersion stimmt nicht mit APP_VERSION $($Match.Groups[1].Value) überein."
            }
          }

      - name: Build Microsoft Store MSIX
        # Source tests and the unpackaged EXE self-test must not seed the real
        # profile before the clean installed-package storage/upgrade test.
        env:
          LOHNMAIL_DATA_DIR: ${{ runner.temp }}/lohnmail-store-build-tests
        shell: powershell
        run: |
          Set-Location lohnmail-pywebview-test
          .\variants\windows\build-store.ps1

      - name: Check packaged activity-log browser layout
        timeout-minutes: 5
        shell: powershell
        run: |
          $BrowserRoot = Join-Path $env:RUNNER_TEMP 'lohnmail-browser-check'
          npm install --prefix $BrowserRoot agent-browser@0.38.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test tool installation failed.' }
          $Browser = Join-Path $BrowserRoot 'node_modules\agent-browser\bin\agent-browser-win32-x64.exe'
          $Edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $Edge)) { throw 'Microsoft Edge is required for the UI regression.' }
          Set-Location lohnmail-pywebview-test
          .venv\Scripts\python.exe tools\check_activity_layout.py --source build\store-msix\validation --browser $Browser --executable $Edge --screenshot dist\store\activity-log-check.png
          if ($LASTEXITCODE -ne 0) { throw 'Packaged activity-log layout failed.' }

      - name: Test MSIX install and upgrade
        shell: powershell
        run: |
          Set-Location lohnmail-pywebview-test
          $Info = Get-Content "dist\store\build_info.json" -Raw | ConvertFrom-Json
          .\variants\windows\test-msix-upgrade.ps1 `
            -StagingDirectory "build\store-msix\staging" `
            -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -ApplicationVersion $Info.version `
            -ApplicationBuild $Info.build

      - name: Verify Store artifact and publish metadata
        id: metadata
        shell: powershell
        run: |
          $Output = "lohnmail-pywebview-test\dist\store"
          $InfoPath = Join-Path $Output "build_info.json"
          if (-not (Test-Path $InfoPath)) { throw "build_info.json fehlt." }
          $Info = Get-Content $InfoPath -Raw | ConvertFrom-Json
          $Msix = Get-Item (Join-Path $Output $Info.filename)
          $Manifest = Join-Path $Output "AppxManifest.xml"
          $HashFile = "$($Msix.FullName).sha256"
          if (-not (Test-Path $Manifest)) { throw "AppxManifest.xml fehlt." }
          if (-not (Test-Path $HashFile)) { throw "SHA256-Datei fehlt." }
          if ($Info.channel -ne "store" -or $Info.architecture -ne "x64") { throw "Build-Metadaten sind ungültig." }
          $ActualHash = (Get-FileHash $Msix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -ne $Info.sha256) { throw "Der MSIX-SHA256 stimmt nicht." }
          "version=$($Info.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          @"
          ## LohnMail Windows Store build

          - Version: $($Info.version)
          - MSIX version: $($Info.msix_version)
          - Distribution: Microsoft Store
          - Architecture: x64
          - Artifact: LohnMail-Windows-Store-$($Info.version)
          - File: $($Info.filename)
          - SHA-256: ``$ActualHash``
          - Commit: ``$env:GITHUB_SHA``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Microsoft Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: LohnMail-Windows-Store-${{ steps.metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            lohnmail-pywebview-test/dist/store/*.msix
            lohnmail-pywebview-test/dist/store/*.sha256
            lohnmail-pywebview-test/dist/store/AppxManifest.xml
            lohnmail-pywebview-test/dist/store/build_info.json
            lohnmail-pywebview-test/dist/store/resources.pri.xml
            lohnmail-pywebview-test/dist/store/activity-log-check.png
