name: Capture LohnMail Windows screenshots

on:
  workflow_dispatch:
  push:
    branches: [feature/microsoft-store-installer]
    paths:
      - .github/workflows/windows-store-screenshots.yml
      - tools/windows_store_screenshots.py

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install application and capture dependencies
        run: python -m pip install -r lohnmail-pywebview-test/requirements.txt pillow pytest
      - name: Run complete application test suite
        working-directory: lohnmail-pywebview-test
        run: python -m pytest -q
      - name: Capture real Windows desktop window
        env:
          PYTHONUTF8: '1'
        run: python tools/windows_store_screenshots.py
      - name: Upload screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LohnMail-Windows-Screenshots-${{ github.sha }}
          path: artifacts/windows-screenshots/
          if-no-files-found: warn
          retention-days: 30
